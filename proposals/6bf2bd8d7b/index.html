ESHTI and employers, turned into application text", "visibility": "partners", "owner": "UEM", "held": "none", "priority": "Critical", "use": "No letters can be annexed; each role must be written into Part B 2.2.1, 3.1 and 3.2.", "origin": "matrix", "status": "to-secure"}, {"id": "EV-09", "type": "evidence", "title": "Institution-specific baselines: adoption, digital/AI competence, accessibility, environmental impact, recurring costs", "visibility": "partners", "owner": "UEM", "held": "none", "priority": "High", "use": "Baselines are needed for any outcome indicator (RC-4).", "origin": "matrix", "status": "to-secure"}, {"id": "EV-10", "type": "evidence", "title": "Consortium agreement principles and partner-approved RACI", "visibility": "partners", "owner": "UEM", "held": "partial", "priority": "High", "use": "Backs the governance claims in 2.2.2; FilmEU model exists as a reference.", "origin": "matrix", "status": "to-secure"}, {"id": "EV-11", "type": "evidence", "title": "Post-grant budgets and maintenance/update commitments for every institutionalised output", "visibility": "partners", "owner": "UEM", "held": "none", "priority": "Critical", "use": "Turns sustainability from assertion into a stated commitment in 3.3 (RC-6).", "origin": "matrix", "status": "to-secure"}, {"id": "EV-12", "type": "evidence", "title": "Controlled evidence of predecessor-project outcomes (ICT4Dev final evidence, FilmEU reuse rights)", "visibility": "partners", "owner": "UEM", "held": "partial", "priority": "Medium", "use": "Replaces project listings with outcomes in 1.3.", "origin": "matrix", "status": "to-secure"}, {"id": "EV-13", "type": "evidence", "title": "UEM coordinator capacity: Rectorate mandate for CIUEM, prior grant-coordination, financial controls", "visibility": "partners", "owner": "UEM", "held": "none", "priority": "Critical", "use": "Evidence that UEM can coordinate (2.1.3, 2.2.2).", "origin": "matrix", "status": "to-secure"}, {"id": "EV-14", "type": "evidence", "title": "In-service training regulations and the appraisal rule that could carry the mandatory staff-training milestone", "visibility": "partners", "owner": "UEM", "held": "none", "priority": "High", "use": "Makes staff training part of an existing process (decision 5).", "origin": "matrix", "status": "to-secure"}, {"id": "EV-15", "type": "evidence", "title": "Independent external reviewers: identification and review protocol", "visibility": "partners", "owner": "UL", "held": "none", "priority": "Medium", "use": "Needed for the external validation of the most consequential results (2.1.2).", "origin": "matrix", "status": "to-secure"}, {"id": "EV-16", "type": "evidence", "title": "Doctoral finance: tuition-waiver approval, cohort of 8–10, funding sources after three intakes", "visibility": "partners", "owner": "UEM", "held": "none", "priority": "Critical", "use": "Backs decision 1 and 6 in 3.3 and 4.2.", "origin": "matrix", "status": "to-secure"}, {"id": "EV-17", "type": "evidence", "title": "Approval calendars per institution (Senate/Council dates) for the adoption gates", "visibility": "partners", "owner": "UEM", "held": "none", "priority": "High", "use": "Lets each adoption gate carry a date and a fallback (2.1.5).", "origin": "matrix", "status": "to-secure"}, {"id": "ESR-REL-01", "type": "esr", "title": "Strong institutional and socio-economic rationale", "visibility": "public", "criterion": "Relevance", "kind": "Strength", "observation": "The proposal clearly linked HEI digital transformation to socio-economic growth and institutional autonomy and addressed systemic constraints through a layered approach.", "proposal_ref": "PDF pp. 21-24, Part B 1.1-1.3; digital transformation was framed as institutional reform connecting organisational practice, doctoral capacity, and digital competence.", "diagnosis": "The rationale was conceptually strong and aligned with Strand 2. Its weakness was not the framing itself but the later failure to operationalise specific socio-economic pathways (RC-3 and RC-4).", "baseline": "ENDE and the CTI Policy now make university-productive-sector, skills, research, innovation, and public-service links more explicit [MZ-01-MZ-02]. UEM's strategy and ICT4Dev record add institutional and delivery grounding [UEM-01; UEM-08-UEM-09]. This strengthens but does not by itself create a sector-facing project.", "response": "Preserve the institutional-transformation framing, but connect each pillar to a small number of selected Mozambican public-service or productive-sector challenges. The theory of change must show benefits beyond the universities.", "owner": "UEM lead; all HEIs contribute. UEM must validate priority sectors and public-policy interfaces.", "indicator": "Signed sector problem statements and measures of institutional or external use. Risk if lost: the revision becomes a collection of academic capacity-building activities without a development pathway.", "priority": "Medium", "priority_full": "Medium; resolved by evidence for the rationale, not for implementation.", "root_causes": ["RC-3", "RC-4"], "origin": "evaluator", "status": "decided"}, {"id": "ESR-REL-02", "type": "esr", "title": "Innovative co-creation and living-lab methods", "visibility": "public", "criterion": "Relevance", "kind": "Strength", "observation": "Co-creation, living labs, and research-informed learning were considered state-of-the-art and innovative.", "proposal_ref": "PDF pp. 24-25, Part B 2.1.1, and pp. 39-40, WP1. The proposal used participatory diagnosis, pilot experimentation, reflection, and handbook production.", "diagnosis": "The method was relevant, but its value was weakened when participation and learning were not consistently tied to formal decisions and adoption (RC-1).", "baseline": "TLU's strategy/implementation model and Africa cooperation support participatory institutional change [TLU-02-TLU-04; W-04]. The INCITE-DEM Democracy Labs toolkit and TLU's documented work-package role now provide concrete evidence of a generative-design method based on sensitisation, collective sensemaking, provotyping and collective dreaming [RI-11; W-14-W-15]. The UEM roadmap and UNITWIN draft show prior adaptation of participatory/DTLab logic toward institutional digital transformation [RI-01; RI-10]. FilmEU provides challenge-based and alliance governance precedents [FE-01; FE-05]. These are transferable capabilities and prior designs, not evidence that UEM or UP has approved a lab model.", "response": "Retain participatory experimentation as generative future-making, not consultation around prescribed solutions. Treat stakeholders as experts of their own experiences; specify how they frame problems, generate alternatives and influence decisions. Define each pilot as a route to an institutional decision, changed process, accountable owner, and monitored use. Avoid treating a lab or handbook as the principal outcome.", "owner": "TLU method lead; UEM institutional owner; UP role provisional. UEM and UP must choose bounded pilot domains and decision owners.", "indicator": "Number of pilots resulting in approved, budgeted, and used procedures or services. Risk: attractive workshops without durable change.", "priority": "Medium", "priority_full": "Medium; resolved by evidence as a capability, adoption design still needed.", "root_causes": ["RC-1"], "origin": "evaluator", "status": "decided"}, {"id": "ESR-REL-03", "type": "esr", "title": "Labour-market, sector, and value-chain links were not explicit", "visibility": "public", "criterion": "Relevance", "kind": "Weakness", "observation": "Connections to labour markets, economic sectors, and value chains were not explicitly articulated.", "proposal_ref": "PDF pp. 21-24, Part B 1.1-1.3; PDF pp. 32-36, Part B 3.1-3.3; PDF pp. 45-47, WP4. The proposal referred broadly to socio-economic development, policymakers, research and innovation stakeholders, and regional uptake, but selected no value chains and assigned no external actor a substantive task.", "diagnosis": "Policy alignment substituted for ecosystem design. External actors were audiences rather than co-designers, validators, challenge owners, placement hosts, adopters, or co-financiers (RC-3).", "baseline": "ENDE calls for HEI-productive-sector articulation and labour-market alignment; the CTI Policy highlights weak private-sector R&D and university linkages [MZ-01-MZ-02]. The selected portfolio includes education, agriculture/rural development and tourism. Education is co-anchored by UEM's course baseline and UP's teacher-education portfolio [UP-09; W-01]. Agriculture/rural development and tourism have direct UEM provincial anchors through ESUDER in Vilankulo and ESHTI in Inhambane [W-16-W-17]. Health is reserved as cumulative evidence of UEM's EU-project capacity, not a fourth domain. ICT4Dev and AI diagnostics add possible use cases [UEM-08-UEM-09; MZ-08-MZ-12]. FilmEU shows associated-partner/industry structures [FE-01; FE-09]. Named Mozambican external actors are not yet committed.", "response": "Use education, agriculture/rural development and tourism as a bounded challenge portfolio cutting across the three pillars, not as separate work packages. UP co-anchors education through teacher preparation and education-system reach; ESUDER anchors agriculture/rural development; ESHTI anchors tourism. Use UEM's EU-funded health research only as evidence of cumulative project/research capacity, not as a fourth challenge domain. Assign external actors roles in needs validation, generative-design challenges, doctoral relevance, course cases, external evaluation, exploitation, and uptake.", "owner": "UEM leads; UP co-leads the education interface; ESUDER anchors agriculture/rural development; ESHTI anchors tourism; MCTD is the intended cross-sector governmental channel; European partners support method. Each institution and external actor must confirm authority, capacity and role. UP's reported national scale in teacher training requires documentary verification.", "indicator": "External roles stated concretely in the application and supported by internal confirmation; number of sector challenges implemented; external use decisions; placements or research briefs. The call does not permit support/intent letters as additional annexes. Risk: repeated score loss on relevance and impact.", "priority": "High", "priority_full": "High; partly resolved by policy evidence, unresolved in consortium design.", "root_causes": ["RC-3"], "origin": "evaluator", "status": "open"}, {"id": "ESR-REL-04", "type": "esr", "title": "Inclusion, equality, non-discrimination, and gender were strong", "visibility": "public", "criterion": "Relevance", "kind": "Strength", "observation": "Equality, inclusion, non-discrimination, gender balance, and support for disadvantaged groups were convincingly integrated.", "proposal_ref": "PDF pp. 21-23, Part B 1.1-1.2; PDF p. 26, M&E; PDF p. 53, Ethics. The proposal used a 40% participation target for women and described gender-responsive measures and inclusive course provision.", "diagnosis": "This was one of the clearest cross-cutting dimensions. The remaining weakness is that participation measures were stronger than accessibility and outcome measures.", "baseline": "National and institutional evidence confirms digital-divide, affordability, language, gender, disability, and rural-access concerns [MZ-01; MZ-11; W-09; UEM-02]. FilmEU inclusion practice offers methods but needs local adaptation [FE-04-FE-06].", "response": "Preserve the commitments and extend them from participation to access conditions, retention, learning gain, completion, decision-making voice, and benefit. Include Portuguese/local-language, low-bandwidth, disability-access, and affordability requirements.", "owner": "UEM lead, UP and all partners. Institutions must confirm available disaggregated data and support services.", "indicator": "Reach, completion, outcome, and satisfaction disaggregated by institution, faculty/campus, gender, disability, and access constraints. Risk: formal inclusion without equitable outcomes.", "priority": "Medium", "priority_full": "Medium; resolved by evidence at principle level.", "root_causes": [], "origin": "evaluator", "status": "decided"}, {"id": "ESR-REL-05", "type": "esr", "title": "EU values beyond inclusion were underdeveloped", "visibility": "public", "criterion": "Relevance", "kind": "Weakness", "observation": "Rule of law and broader governance principles were insufficiently elaborated.", "proposal_ref": "PDF p. 32, governance; PDF p. 53, Ethics. The proposal mentioned accountability, transparency, inclusiveness, GDPR-style data principles, and fundamental rights, but did not turn them into project controls.", "diagnosis": "Values were treated mainly as ethics narrative rather than operational requirements for governance, procurement, data, academic integrity, AI use, participation, and grievance/redress (RC-7).", "baseline": "Mozambique's development, cyber, data, and emerging AI instruments provide governance, transparency, rights, and accountability anchors [MZ-01; MZ-05-MZ-10]. TLU and Lusofona provide integrity and AI-use precedents [W-03-W-05; UL-03; UL-08]. FilmEU provides mediation and governance processes [FE-01]. Some national AI/data instruments remain draft or status-unclear.", "response": "Define an EU-values implementation framework covering transparent selection, academic freedom and integrity, accountable decision-making, privacy, human oversight, non-discrimination, accessible participation, complaints, and conflicts of interest.", "owner": "UEM governance lead; TLU/Lusofona technical support; legal/ethics owners at each HEI validate applicability.", "indicator": "Approved procedures, published criteria, decision logs, disclosure statements, grievance records, and compliance reviews. Risk: values remain rhetorical.", "priority": "Medium", "priority_full": "Medium; partly resolved by evidence, not yet by project controls.", "root_causes": ["RC-7"], "origin": "evaluator", "status": "open"}, {"id": "ESR-REL-06", "type": "esr", "title": "Needs-derived, realistic, measurable objectives", "visibility": "public", "criterion": "Relevance", "kind": "Strength", "observation": "Objectives were derived methodically from multilevel needs and judged clear, realistic, measurable, achievable, and aligned with HEI modernisation, research, internationalisation, and national strategies.", "proposal_ref": "PDF pp. 22-23, Part B 1.2. Four objectives specified units, baselines, and targets for pilots/handbook, doctoral framework/supervisors, gender measures, and courses.", "diagnosis": "Output-level measurability was strong. The later ESR comments show that output targets did not constitute a complete adoption and impact framework (RC-4).", "baseline": "UEM statistics, national strategies, institutional course evidence, and approval frameworks can now support more credible baselines [UEM-03-UEM-07; MZ-01-MZ-04; W-01-W-02]. Underlying institutional datasets are still missing.", "response": "Preserve SMART discipline but replace outdated zero baselines, especially for the existing UEM course. Add outcome, adoption, equity, external-use, and sustainability indicators.", "owner": "UEM monitoring lead, with institutional data owners. Each partner must validate baselines and denominators.", "indicator": "Signed indicator reference sheets with definition, source, frequency, owner, baseline, target, and disaggregation. Risk: apparently precise but factually wrong baselines.", "priority": "Medium", "priority_full": "Medium; resolved by evidence for the objective method.", "root_causes": ["RC-4"], "origin": "evaluator", "status": "decided"}, {"id": "ESR-REL-07", "type": "esr", "title": "Objectives were insufficiently linked to specific HEIs and timelines", "visibility": "public", "criterion": "Relevance", "kind": "Weakness", "observation": "Institution-specific linkages and implementation timelines were insufficiently detailed, limiting operational clarity.", "proposal_ref": "PDF pp. 22-23, Part B 1.2; PDF pp. 37-52, WPs and timetable. The proposal named UEM and UP in targets and assigned tasks, but often used identical outputs, treated a shared programme as a single approval object, and displayed a timetable without institution-specific decision gates.", "diagnosis": "Consortium-wide objectives obscured different starting points, authorities, and approval pathways (RC-2 and RC-5).", "baseline": "UEM, TLU, UP, and Lusofona statutes/regulations now clarify many decision routes [UEM-03-UEM-05; TLU-01; UP-01-UP-02; UL-01-UL-02]. UEM's existing course and TLU-UEM agreements change the baseline [P-01-P-02; W-01-W-02]. Exact routes and current documents still require partner confirmation.", "response": "Define each objective by institution: starting state, accountable unit, approving body, due date, decision gate, evidence, dependencies, and fallback. Do not assume that UEM and UP need or can approve the same outputs on the same schedule.", "owner": "UEM coordinates; every HEI validates its institutional pathway. UP's role and legal/PIC identity require explicit confirmation.", "indicator": "Institution-specific adoption and approval milestones. Risk: commitments that cannot be authorised within the grant period.", "priority": "High", "priority_full": "High; partner decision required.", "root_causes": ["RC-2", "RC-5"], "origin": "evaluator", "status": "open"}, {"id": "ESR-REL-08", "type": "esr", "title": "Strong EU added value", "visibility": "public", "criterion": "Relevance", "kind": "Strength", "observation": "Prior Erasmus+ cooperation, advanced European methods, and the move from mobility to institutional transformation, doctoral training, and systemic capacity building demonstrated EU added value.", "proposal_ref": "PDF pp. 23-24, Part B 1.3; PDF pp. 54-57, previous projects/publications. It cited TLU-UEM cooperation, Lusofona experience, SPIDER/UEM activity, World Bank investments, and regional/continental alignment.", "diagnosis": "The transnational rationale was persuasive. Its credibility was reduced by limited specification of what was learned, reused, and changed (RC-4).", "baseline": "Signed TLU-UEM instruments and FilmEU outputs now provide stronger institutional evidence [P-01-P-02; FE-01-FE-14]. Lusofona and TLU have concrete joint QA, curriculum, governance, and mobility experience. These assets still require named staff, rights to reuse tools, and Mozambique adaptation.", "response": "Preserve EU added value as reciprocal method transfer and joint learning, not one-way import. Define exactly which TLU/Lusofona methods are reused and what UEM/UP contribute to European learning.", "owner": "TLU and Lusofona document inputs; UEM approves local adaptation. Confirm staff availability and reusable assets.", "indicator": "Adaptation records, jointly produced methods, and reciprocal learning outputs. Risk: generic internationalisation claims.", "priority": "Medium", "priority_full": "Medium; partly resolved.", "root_causes": ["RC-4"], "origin": "evaluator", "status": "decided"}, {"id": "ESR-REL-09", "type": "esr", "title": "Previous initiatives were insufficiently specified", "visibility": "public", "criterion": "Relevance", "kind": "Weakness", "observation": "References to earlier initiatives did not adequately demonstrate cumulative impact.", "proposal_ref": "PDF pp. 23-24, Part B 1.3, and pp. 54-56, previous-project list. Projects and broad lessons were named, but results, evidence, shortcomings, reused assets, and direct design consequences were not systematically shown.", "diagnosis": "Project inventories substituted for a predecessor-to-design evidence chain (RC-4).", "baseline": "The ICT4Dev final report/article, signed TLU-UEM agreements, UEM cooperation records, and FilmEU outputs allow a stronger cumulative narrative [UEM-08-UEM-09; P-01-P-07; FE-01-FE-14]. Many prior projects still lack independently verified outcome data.", "response": "Create a concise predecessor matrix: initiative, verified result, lesson/failure, asset reused, gap remaining, and resulting MOZBEATS activity. Exclude unsupported claims of impact.", "owner": "Each HEI supplies controlled evidence for the initiatives it invokes; UEM consolidates.", "indicator": "Traceable reuse of curricula, agreements, platforms, methods, staff capacity, or datasets. Risk: repetition rather than cumulative capacity building.", "priority": "Medium", "priority_full": "Medium; partly resolved.", "root_causes": ["RC-4"], "origin": "evaluator", "status": "open"}, {"id": "ESR-DES-01", "type": "esr", "title": "Coherent layered project architecture", "visibility": "public", "criterion": "Design", "kind": "Strength", "observation": "Institutional pilots, doctoral training, and digital literacy formed a coherent response to system, institutional, and individual capacity gaps; work packages broadly aligned with needs and outputs.", "proposal_ref": "PDF pp. 24-26, Part B 2.1.1-2.1.2; PDF pp. 37-49, WPs 1-5.", "diagnosis": "The architecture is worth preserving. Weaknesses arose inside and between pillars because dependencies, adoption, and outcomes were not sufficiently explicit (RC-1).", "baseline": "The updated baseline strengthens all three pillars but changes their starting states: UEM already has a course; the doctoral pathway is UEM-centred; institutional policy and AI contexts have advanced [P-02; W-01-W-02; UEM-02-UEM-05; MZ-07-MZ-10].", "response": "Retain the three pillars, but redefine them as institutionalisation and quality improvement rather than creation from zero. Add a cross-pillar governance/data/ethics/measurement spine.", "owner": "UEM lead; consortium validates interdependencies.", "indicator": "One integrated results chain showing how pillar outputs jointly change institutional capability. Risk: three parallel subprojects.", "priority": "Medium", "priority_full": "Medium; resolved by evidence.", "root_causes": ["RC-1"], "origin": "evaluator", "status": "decided"}, {"id": "ESR-DES-02", "type": "esr", "title": "Links between objectives, methodology, activities, and results were incomplete", "visibility": "public", "criterion": "Design", "kind": "Weakness", "observation": "Coherence was not fully convincing because objectives, methodology, and activities were insufficiently linked and activities were not comprehensive enough to achieve every expected result.", "proposal_ref": "PDF pp. 22-26, objectives/method; PDF pp. 37-49, WPs. Activities produced diagnoses, frameworks, courses, reports, and agreements, but several expected results - institutional reform, viable doctoral provision, sustained competence, and ecosystem impact - lacked complete activity chains.", "diagnosis": "Outputs were specified more thoroughly than behavioural, institutional, and systemic transitions (RC-1 and RC-4).", "baseline": "TLU implementation planning, institutional approval rules, and FilmEU QA/governance methods provide templates for owner-indicator-decision chains [TLU-01-TLU-04; FE-01; FE-07]. They do not solve the design automatically.", "response": "Build the blueprint from outcome chains, not inherited WPs. For every expected outcome specify necessary activities, assumptions, decision gates, owner, evidence, and fallback. Remove results that lack an affordable, approvable activity chain.", "owner": "UEM design authority with all WP leads. Partners must validate resources and dependencies before WPs are fixed.", "indicator": "Every outcome maps to at least one necessary activity, adoption decision, and outcome indicator. Risk: a polished but internally incomplete implementation plan.", "priority": "High", "priority_full": "High; unresolved until the blueprint is redesigned.", "root_causes": ["RC-1", "RC-4"], "origin": "evaluator", "status": "open"}, {"id": "ESR-DES-03", "type": "esr", "title": "Participatory methodology was appropriate", "visibility": "public", "criterion": "Design", "kind": "Strength", "observation": "Participatory transformation, co-creation, pilot experimentation, and research-informed learning were appropriate for institutional reform.", "proposal_ref": "PDF pp. 24-25, Part B 2.1.1; PDF pp. 39-40, WP1.", "diagnosis": "The approach matched the problem. It needs stronger boundaries, decision ownership, data methods, and adoption criteria.", "baseline": "TLU capability, the INCITE-DEM Democracy Labs toolkit and FilmEU challenge-based practice strengthen the methodological basis [TLU-02-TLU-04; W-04; RI-11; W-14-W-15; FE-05]. The prior UEM roadmap already proposes stakeholder mapping, multi-campus co-design, pilots and policy alignment [RI-10]. UEM's statutes and draft strategy define institutional constraints the method must respect [UEM-02-UEM-03].", "response": "Specify who participates, how representatives are selected, how experiential knowledge is elicited and protected, what data are collected, how power imbalances and dissent are handled, which decisions participants influence, and how collectively generated possibilities enter formal governance. European partners contribute process capability rather than prescribed solutions.", "owner": "TLU supports method; UEM owns decisions; UP adapts only after role confirmation.", "indicator": "Diversity of participants, documented decisions influenced, and adoption results. Risk: participation as consultation theatre.", "priority": "Medium", "priority_full": "Medium; resolved by evidence at method level.", "root_causes": [], "origin": "evaluator", "status": "decided"}, {"id": "ESR-DES-04", "type": "esr", "title": "Intervention logic and measurement remained generic", "visibility": "public", "criterion": "Design", "kind": "Weakness", "observation": "The intervention logic had limited detail on indicators, baselines, and targets.", "proposal_ref": "PDF pp. 22-23 and 25-26. The proposal gave numerical targets for outputs but relied on zero or \"to be established\" baselines and offered few measures of competence gain, institutional use, process change, research performance, or external benefit.", "diagnosis": "Deliverables and participation were used as proxies for outcomes (RC-4).", "baseline": "UEM statistics and course pages, national strategy indicators, and TLU implementation planning support indicator development [UEM-07; W-01-W-02; MZ-01-MZ-04; MZ-11; TLU-03]. Underlying data definitions and course results are not yet obtained.", "response": "Create an indicator reference sheet for each outcome with definition, source, baseline date/value, denominator, disaggregation, target logic, collection frequency, owner, and decision use. Conduct baseline measurement before final targets where evidence is unavailable.", "owner": "UEM M&E/data owner; each institution supplies data. Partner confirmation needed.", "indicator": "Validated baseline dataset and indicator dictionary. Risk: precise-looking but unverifiable targets.", "priority": "Medium", "priority_full": "Medium; partly resolved.", "root_causes": ["RC-4"], "origin": "evaluator", "status": "open"}, {"id": "ESR-DES-05", "type": "esr", "title": "Institutional adoption was underdeveloped", "visibility": "public", "criterion": "Design", "kind": "Weakness", "observation": "Key adoption aspects were underdeveloped despite identified risks.", "proposal_ref": "PDF pp. 24-26, methodology/M&E; PDF p. 30, risks R4, R10, R12, R16, R19; WP milestones on validation/embedding. The proposal named adoption risks but often treated GA validation or a future approval record as sufficient.", "diagnosis": "Adoption was not designed as changed routine, resource allocation, accountable ownership, staff capability, support, and verified use (RC-1 and RC-5).", "baseline": "Statutes and regulations now clarify formal routes; UEM's existing course and Lusofona's formal AI dispatch provide precedents [UEM-03-UEM-05; TLU-01; UP-01-UP-02; UL-01-UL-03; W-01-W-02]. Exact institutional procedures and budgets remain unconfirmed.", "response": "Give every major output an adoption package: formal decision, business/process owner, operating procedure, staff preparation, help/support, recurring cost, update cycle, use target, and review date.", "owner": "UEM and each adopting institution. Written partner decisions are required before drafting commitments.", "indicator": "Approved and budgeted use, not publication or training alone. Risk: outputs exist but institutional practice does not change.", "priority": "High", "priority_full": "High; partner decision required.", "root_causes": ["RC-1", "RC-5"], "origin": "evaluator", "status": "open"}, {"id": "ESR-DES-06", "type": "esr", "title": "Work plan and sequencing were professionally prepared", "visibility": "public", "criterion": "Design", "kind": "Strength", "observation": "WPs, tasks, milestones, deliverables, timelines, hybrid arrangements, and resources were judged well organised and feasible.", "proposal_ref": "PDF pp. 37-52, Part B 4.1-4.2.", "diagnosis": "The administrative structure was strong, but some dates and dependencies were not institution-specific and substantive activities were incomplete.", "baseline": "The baseline makes sequencing more realistic by identifying approval routes and existing implementation [UEM-03-UEM-05; UP-01-UP-02; UL-01-UL-02; TLU-01; W-01-W-02].", "response": "Preserve disciplined sequencing and co-location where cost-effective. Rebuild dates around approval lead times, baseline measurement, pilot/evaluation cycles, and decision gates.", "owner": "UEM PMO; institutional owners validate calendars.", "indicator": "Critical-path schedule with dependencies and decision owners. Risk: polished timing detached from approval reality.", "priority": "Low", "priority_full": "Low; resolved by evidence.", "root_causes": [], "origin": "evaluator", "status": "decided"}, {"id": "ESR-DES-07", "type": "esr", "title": "Dependence on institutional approval was an implementation risk", "visibility": "public", "criterion": "Design", "kind": "Weakness", "observation": "Institutional approvals could delay implementation.", "proposal_ref": "PDF p. 30, risks R6, R8, R16; PDF pp. 41-45, WP2/WP3. Approval was acknowledged but programme and course milestones assumed validation, admission readiness, mandatory embedding, and roll-out within the project.", "diagnosis": "Approval dependencies were risks rather than designed stage gates with accountable authorities and fallbacks (RC-5). The 2026 shared UEM-UP doctoral architecture is now inconsistent with the bilateral UEM-centred addendum.", "baseline": "UEM, UP, TLU, and Lusofona governance documents identify many authorities; P-02 confirms a UEM pathway [UEM-03-UEM-05; UP-01-UP-02; TLU-01; UL-01-UL-02; P-02]. UEM statutes are under revision, UP procedures remain incomplete, and external accreditation routes require confirmation.", "response": "Decide the doctoral architecture before blueprint completion. Map approvals by institution and external authority; set go/no-go gates, lead times, evidence, and fallback deliverables that remain valuable if accreditation/admission falls outside the grant period.", "owner": "UEM Rectorate/academic bodies lead; UP decides its role; TLU/Lusofona validate their commitments. Formal partner decisions required.", "indicator": "Approved pathway map, dated decisions, and fallback plan. Risk: legally or institutionally unapprovable core result.", "priority": "Critical", "priority_full": "Critical; partner decision required.", "root_causes": ["RC-5"], "origin": "evaluator", "status": "open"}, {"id": "ESR-DES-08", "type": "esr", "title": "Budget was proportionate and cost-effective", "visibility": "public", "criterion": "Design", "kind": "Strength", "observation": "The budget prioritised personnel-driven capacity building and was judged proportionate and feasible.", "proposal_ref": "PDF p. 29, Part B 2.1.4; PDF pp. 41, 43, 45, 47, and 49, WP budgets.", "diagnosis": "The personnel focus matched capacity building, and limited equipment/travel supported efficiency.", "baseline": "Existing platforms, courses, institutional units, and cooperation can reduce duplicate investment [W-01-W-02; UP-04-UP-06; UEM-08; P-01-P-02]. Their actual capacity and marginal costs need verification.", "response": "Preserve reuse and capacity-building logic; explain unit costs and staff effort through outputs and outcomes rather than general statements.", "owner": "UEM finance lead with partner finance units.", "indicator": "Cost per adopted institutional result and documented in-kind/existing resources. Risk: hidden delivery costs or unfunded post-grant operation.", "priority": "Low", "priority_full": "Low; resolved by evidence.", "root_causes": [], "origin": "evaluator", "status": "decided"}, {"id": "ESR-DES-09", "type": "esr", "title": "Staff costs raised efficiency concerns", "visibility": "public", "criterion": "Design", "kind": "Weakness", "observation": "Staff costs were notably high across several beneficiaries, though not enough to undermine feasibility.", "proposal_ref": "PDF pp. 41-50, WP budgets/staff effort. Personnel totalled 156 person-months, with substantial allocations across all partners.", "diagnosis": "The proposal described roles but did not provide sufficiently transparent workload-to-result justification or unit-cost comparison.", "baseline": "New evidence clarifies specialised institutional capabilities [TLU-01-TLU-05; UL-03-UL-09; UP-04-UP-08; UEM-08-UEM-09], allowing sharper task allocation. Named staff availability and workloads remain unverified.", "response": "Recalculate effort after the blueprint is fixed. Provide task-level responsibility, person-month logic, output volume, senior/junior mix, local ownership, and comparison with travel/subcontracting alternatives. Avoid equalised allocations unsupported by work.", "owner": "UEM finance/project lead; every partner validates staff and rates.", "indicator": "Person-month-to-task matrix and cost-efficiency narrative. Risk: competitive score loss and weak value-for-money perception.", "priority": "Medium", "priority_full": "Medium; unresolved.", "root_causes": [], "origin": "evaluator", "status": "open"}, {"id": "ESR-DES-10", "type": "esr", "title": "Internal QA and monitoring were adequate", "visibility": "public", "criterion": "Design", "kind": "Strength", "observation": "Continuous monitoring, peer review, milestone validation, risk management, indicators, evaluation, and mitigation were adequately defined.", "proposal_ref": "PDF pp. 25-26, Part B 2.1.2; PDF p. 30, risk register; PDF pp. 47-49, WP5.", "diagnosis": "Internal controls were credible, but they focused on completion and consortium review more than independent quality and outcome evidence.", "baseline": "Lusofona/FilmEU QA and TLU planning offer mature methods [UL-07; FE-07; TLU-03].", "response": "Preserve peer review, milestone review, and risk management while distinguishing internal QC, outcome evaluation, external review, and formal institutional approval.", "owner": "UEM accountability; Lusofona can support QA; external reviewers remain to be selected.", "indicator": "Quality plan with review type, reviewer independence, criteria, evidence, decision use, and closure tracking.", "priority": "Low", "priority_full": "Low; resolved by evidence.", "root_causes": [], "origin": "evaluator", "status": "decided"}, {"id": "ESR-DES-11", "type": "esr", "title": "Benchmarking and external validation were too generic", "visibility": "public", "criterion": "Design", "kind": "Weakness", "observation": "The QA framework did not explicitly detail benchmarking and external validation.", "proposal_ref": "PDF pp. 25-26 and 32. A Steering Committee offered expert-informed oversight, but benchmarks, reviewer independence, validation criteria, response procedures, and external decision use were not specified.", "diagnosis": "Named expert oversight was treated as external QA without a defined review protocol (RC-4).", "baseline": "FilmEU's EQ-Arts review supplies an external QA model and specific recommendations; national and institutional frameworks offer benchmarks [FE-07; TLU-03; W-03-W-05; MZ-01-MZ-02; PT-03; PT-08]. European criteria require adaptation to Mozambique.", "response": "Define independent reviews for institutional pilots, the GenAI/course component, and doctoral design. Specify criteria, timing, reviewers, conflicts of interest, evidence, publication/confidentiality, management response, and decision consequences.", "owner": "UEM QA owner; Lusofona method support; Mozambican regulator/sector expertise where appropriate.", "indicator": "External review reports and documented closure of recommendations. Risk: internally validated outputs with limited credibility.", "priority": "High", "priority_full": "High; partly resolved by available models.", "root_causes": ["RC-4"], "origin": "evaluator", "status": "open"}, {"id": "ESR-DES-12", "type": "esr", "title": "Environmental sustainability was only implicit", "visibility": "public", "criterion": "Design", "kind": "Weakness", "observation": "Reduced travel and hybrid formats were not an adequate strategic treatment of environmental sustainability.", "proposal_ref": "PDF p. 29, cost effectiveness; pp. 37 and 50-52, hybrid/co-located events. No substantive work package set green-digital criteria, measurements, owners, or mitigation.", "diagnosis": "Sustainability was interpreted mainly as fewer trips, not as digital infrastructure, device lifecycle, energy, hosting, AI/model use, procurement, accessibility, or climate resilience (RC-7).", "baseline": "Estonia's Digital Agenda and RDIE strategy, Mozambique's emerging AI strategy, Portugal's digital strategy, and FilmEU pedagogy/inclusion evidence provide green-digital principles [EE-01; EE-03; MZ-07; PT-01-PT-02; FE-05-FE-06]. MZ-07 is a draft and none supplies a MOZBEATS baseline.", "response": "Add a proportional environmental plan covering travel, hybrid quality, device reuse/procurement, hosting/data/AI choices, energy/material awareness, e-waste, and measurement. Integrate criteria into each pillar rather than isolate them in management.", "owner": "UEM owns local plan; TLU/Lusofona share tested practices. Institutions must provide current procurement/hosting constraints.", "indicator": "Avoided travel, device reuse/lifecycle criteria, low-bandwidth compliance, hosting/AI-use criteria, and responsible procurement records. Risk: repeated clear-gap finding.", "priority": "High", "priority_full": "High; partly resolved by policy evidence.", "root_causes": ["RC-7"], "origin": "evaluator", "status": "open"}, {"id": "ESR-PAR-01", "type": "esr", "title": "Basic management roles and bodies were credible", "visibility": "public", "criterion": "Partnership", "kind": "Strength", "observation": "Day-to-day coordination, financial management, monitoring, reporting, steering, WP leadership, institutional coordination, and decision-making were partially well structured.", "proposal_ref": "PDF pp. 25-26, project management; PDF p. 32, consortium management; PDF pp. 47-49, WP5.", "diagnosis": "The architecture had the right basic components but lacked operating detail.", "baseline": "UEM/TLU statutes, the bilateral instruments, and FilmEU governance provide clearer authority and procedures [UEM-03; TLU-01; P-01-P-02; FE-01]. UEM's intended 2027 coordinator role is a material change requiring a redesigned governance model.", "response": "Retain a lean General Assembly/Steering/PMO structure but place UEM visibly in legal, strategic, and day-to-day control. Distinguish grant governance from institutional academic approvals.", "owner": "UEM; all partners validate representation and delegated authority.", "indicator": "Approved governance charter and named authorised representatives. Risk: nominal UEM coordination with shadow control elsewhere.", "priority": "Medium", "priority_full": "Medium; partly resolved.", "root_causes": [], "origin": "evaluator", "status": "decided"}, {"id": "ESR-PAR-02", "type": "esr", "title": "Governance, timelines, responsibilities, and procedures lacked detail", "visibility": "public", "criterion": "Partnership", "kind": "Weakness", "observation": "The overall framework remained generic; governance structures, timelines, responsibilities, and collaboration procedures were not fully elaborated.", "proposal_ref": "PDF p. 32 and pp. 47-49. Consensus, monthly meetings, four GAs, a Steering Committee, and WP tasks were stated, but quorum, voting, delegated authority, documentation, escalation, change control, data/document ownership, and response deadlines were absent.", "diagnosis": "Governance bodies were described without an operating constitution or RACI (RC-1 and RC-5).", "baseline": "FilmEU provides decision logs, PMO functions, academic/advisory bodies, milestone-linked finance, and dispute procedures [FE-01]. Institutional statutes clarify legal authority [UEM-03; TLU-01; UP-01; UL-01]. FilmEU is too complex to copy wholesale.", "response": "Design a proportionate consortium charter with composition, mandate, quorum, voting, reserved matters, delegated decisions, RACI, meeting rhythm, records, change control, escalation time limits, and links to each HEI's authorities.", "owner": "UEM lead; partner legal/administrative owners validate.", "indicator": "Signed consortium agreement and decision log. Risk: slow, contested, or unauthorised decisions.", "priority": "High", "priority_full": "High; partly resolved by available models.", "root_causes": ["RC-1", "RC-5"], "origin": "evaluator", "status": "open"}, {"id": "ESR-PAR-03", "type": "esr", "title": "Academic consortium composition was credible and balanced", "visibility": "public", "criterion": "Partnership", "kind": "Strength", "observation": "Target-country leadership and European methodological/QA expertise formed a credible academic partnership.", "proposal_ref": "PDF p. 31, Part B 2.2.1; PDF pp. 27-29, staff.", "diagnosis": "Complementarity was plausible. Some claims, especially established UEM-UP cooperation and UP's precise technology/research role, were insufficiently evidenced.", "baseline": "UEM, TLU, Lusofona, and FilmEU capabilities are now better documented [UEM-01-UEM-09; TLU-01-TLU-05; UL-01-UL-09; FE-01-FE-14]. UP has credible CEAD/CIUP and teacher-education assets but no substantive cooperation yet [UP-01-UP-09].", "response": "Preserve all four HEIs but adopt asymmetric, evidence-based roles. UEM coordinates; UP owns a bounded role; TLU and Lusofona provide distinct specialist inputs.", "owner": "UEM proposes; each partner confirms staff, resources, authority, and post-grant responsibility.", "indicator": "Role/resource commitments mapped to outcomes and stated within the permitted application content, backed by internal confirmation rather than proposed letter annexes. Risk: role inflation or duplication.", "priority": "Medium", "priority_full": "Medium; resolved by evidence for composition, pending formal commitments.", "root_causes": [], "origin": "evaluator", "status": "decided"}, {"id": "ESR-PAR-04", "type": "esr", "title": "Non-academic and private-sector participation was insufficient", "visibility": "public", "criterion": "Partnership", "kind": "Weakness", "observation": "Lack of active non-academic/private-sector organisations limited innovation and value-chain linkages.", "proposal_ref": "PDF pp. 31-32, consortium; PDF pp. 45-47, WP4. Only HEIs were beneficiaries. External actors appeared as stakeholders/audiences, not as associated partners or task contributors.", "diagnosis": "The project was designed as an academic consortium with dissemination outward, not a multi-actor change coalition (RC-3).", "baseline": "ENDE, CTI, AI diagnostics, and ICT4Dev justify government, productive-sector, civil-society, and innovation-ecosystem roles [MZ-01-MZ-02; MZ-08-MZ-10; UEM-08-UEM-09]. The MCTD UNITWIN support letter verifies an existing policy relationship and compatible direction, but not a MOZBEATS commitment [RI-03]. Democracy Labs provide a practical model for involving citizens, civil society and policymakers as co-creators rather than audiences [RI-11; W-14-W-15]. FilmEU shows one possible associated-partner model [FE-01; FE-09]. No external organisation is yet committed to a MOZBEATS role.", "response": "Decide which external actors are necessary for outcomes. Give them roles in problem framing, future-making, challenge ownership, prototyping, validation, placement, review or uptake as appropriate; do not add logos without deliverables, influence and incentives.", "owner": "UEM identifies national actors; UP identifies teacher-education/community actors; partners validate conflicts and capacity.", "indicator": "Signed tasks, attendance is insufficient; require delivered challenges, reviews, placements, data, adoption, or co-finance. Risk: repeat finding and weak sector legitimacy.", "priority": "High", "priority_full": "High; unresolved.", "root_causes": ["RC-3"], "origin": "evaluator", "status": "open"}, {"id": "ESR-PAR-05", "type": "esr", "title": "Tasks and responsibilities matched institutional profiles", "visibility": "public", "criterion": "Partnership", "kind": "Strength", "observation": "Task distribution was balanced and aligned with partner expertise.", "proposal_ref": "PDF pp. 31 and 39-49. TLU led Living Labs and doctoral design, Lusofona coordinated and led digital literacy/QA, UEM led dissemination and local implementation, and UP contributed curriculum/technology/training.", "diagnosis": "The allocation was plausible in 2026, but the new UEM coordinator role and updated evidence require redistribution.", "baseline": "Lusofona's strongest verified specialisms are responsible AI/integrity, QA, doctoral placements, and FilmEU methods; TLU's are participatory transformation, doctoral/co-supervision, integrity, and implementation planning [UL-03-UL-09; TLU-01-TLU-05; FE-01-FE-14].", "response": "Preserve competence-based allocation but avoid shadow coordination. Assign UEM final responsibility for Mozambican institutional decisions and data; assign European partners bounded method/QA roles.", "owner": "UEM; all partners confirm named staff and workload.", "indicator": "RACI mapped to outcomes, not merely tasks. Risk: nominal ownership or duplicated leadership.", "priority": "Medium", "priority_full": "Medium; resolved by evidence conceptually.", "root_causes": [], "origin": "evaluator", "status": "decided"}, {"id": "ESR-PAR-06", "type": "esr", "title": "Regular collaboration mechanisms were present", "visibility": "public", "criterion": "Partnership", "kind": "Strength", "observation": "Meetings, reporting, and steering supported information sharing and joint decisions.", "proposal_ref": "PDF pp. 25-26, 32, 47-52.", "diagnosis": "Meeting frequency was credible, but collaboration was described as events rather than workflows with repositories, response times, handoffs, and multilingual/document controls.", "baseline": "FilmEU governance and QA evidence provides shared-repository, templates, PMO, and decision-record lessons [FE-01; FE-07].", "response": "Preserve monthly and milestone rhythms but specify working language(s), document repository, version control, decision/action logs, handoff rules, response times, and accessibility/time-zone arrangements.", "owner": "UEM PMO; partners validate tools and data rules.", "indicator": "On-time decisions/actions and controlled records. Risk: meetings without operational coordination.", "priority": "Low", "priority_full": "Low; partly resolved.", "root_causes": [], "origin": "evaluator", "status": "decided"}, {"id": "ESR-PAR-07", "type": "esr", "title": "Communication and formal conflict resolution were insufficient", "visibility": "public", "criterion": "Partnership", "kind": "Weakness", "observation": "Efficient communication and formal conflict-resolution mechanisms were not sufficiently elaborated.", "proposal_ref": "PDF p. 32 and WP5. Consensus and timely issue resolution were asserted, but deadlock, escalation, mediation, conflicts of interest, breach, or appeal procedures were absent.", "diagnosis": "Collegiality was treated as a substitute for dispute design (RC-1).", "baseline": "FilmEU provides mediation, arbitration, escalation, and governance precedents [FE-01]. Institutional statutes provide authority boundaries [UEM-03; TLU-01; UP-01; UL-01].", "response": "Add a tiered process: task/WP resolution, PMO escalation, Steering/GA decision, mediation, and final contractual remedy; define time limits, recusals, records, applicable agreement/law, and urgent decisions.", "owner": "UEM with partner legal/administrative review.", "indicator": "Signed procedure and logged resolution times. Risk: unresolved disputes delay milestones or damage partnership.", "priority": "Medium", "priority_full": "Medium; partly resolved.", "root_causes": ["RC-1"], "origin": "evaluator", "status": "open"}, {"id": "ESR-PAR-08", "type": "esr", "title": "Strong partner-country commitment and ownership", "visibility": "public", "criterion": "Partnership", "kind": "Strength", "observation": "Mozambican partners held central roles and demonstrated ownership and complementary contributions.", "proposal_ref": "PDF pp. 31-32 and WPs. UEM and UP were implementation sites and shared decision-making.", "diagnosis": "The evaluator credited ownership. However, equal-looking UEM/UP roles were not sufficiently grounded in demonstrated cooperation or formal commitments.", "baseline": "UEM's strategy, projects, course, and TLU instruments strongly reinforce ownership [UEM-01-UEM-09; P-01-P-02; W-01-W-02]. UP's institutional capacity is plausible, but its MOZBEATS commitment and cooperation are not yet evidenced [UP-01-UP-08].", "response": "Make UEM coordination substantive through authority, budget, data, stakeholder, and adoption ownership. Present UP commitments only after validation.", "owner": "UEM; UP must approve its role, resources, and institutional owner.", "indicator": "Signed institutional commitments and recurrent responsibilities. Risk: overclaiming ownership from an untested partner relationship.", "priority": "Medium", "priority_full": "Medium; partly resolved.", "root_causes": [], "origin": "evaluator", "status": "decided"}, {"id": "ESR-PAR-09", "type": "esr", "title": "Wider stakeholder engagement and external ownership were weak", "visibility": "public", "criterion": "Partnership", "kind": "Weakness", "observation": "Broader stakeholder engagement was only partially evident, limiting external ownership and wider impact.", "proposal_ref": "PDF pp. 33-34 and 45-47. Stakeholders were target audiences for workshops, briefings, dissemination, and policy dialogue, with no clear rights, contributions, or uptake commitments.", "diagnosis": "Outreach was confused with engagement and ownership (RC-3).", "baseline": "UEM has national-policy interfaces and prior ecosystem activity [MZ-13; UEM-08-UEM-09; P-03-P-07]. The MCTD UNITWIN letter adds verified evidence of a policy relationship [RI-03]. Democracy Labs add a documented method for inclusive generative engagement, while FilmEU offers advisory/associated-partner methods [RI-11; W-14-W-15; FE-01; FE-09]. No Mozambique stakeholder governance is yet designed.", "response": "Create a stakeholder architecture distinguishing co-designers/future-makers, statutory decision-makers, external reviewers, users/adopters, disseminators, and beneficiaries. Give selected actors defined influence, seats or gates where appropriate, and record how their contributions change designs or decisions.", "owner": "UEM; sector/regulatory partners must accept roles.", "indicator": "Stakeholder contributions completed and decisions influenced, not attendance counts. Risk: limited external legitimacy and uptake.", "priority": "High", "priority_full": "High; unresolved.", "root_causes": ["RC-3"], "origin": "evaluator", "status": "open"}, {"id": "ESR-IMP-01", "type": "esr", "title": "Core outputs were reusable and transferable", "visibility": "public", "criterion": "Impact", "kind": "Strength", "observation": "The handbook, doctoral framework, and digital-literacy courses were designed for reuse and potential replication in Southern Africa and Lusophone contexts; multiplier effects were conceptually embedded.", "proposal_ref": "PDF pp. 32-36, impact/dissemination/sustainability; WP deliverables.", "diagnosis": "Transfer ambition was credible, but outputs lacked sufficiently concrete adaptation, licensing, hosting, support, adoption, and measurement pathways.", "baseline": "CEAD/CIUP, Lusofona platforms/guidance, TLU Africa networks, and FilmEU toolkits show potential channels [UP-04-UP-06; UL-03-UL-09; W-04; FE-01-FE-09]. Access rights, maintenance resources, and cross-context outcomes remain unknown.", "response": "Preserve open/reusable design but define each output's users, licence, language, format, accessibility, localisation conditions, host, maintainer, support, update cycle, and replication evidence.", "owner": "UEM owns Mozambique repositories; output leads confirm rights and maintenance.", "indicator": "Downloads are insufficient; measure qualified reuse, adaptation, institutional adoption, and sustained use. Risk: transferable in theory only.", "priority": "Medium", "priority_full": "Medium; partly resolved.", "root_causes": [], "origin": "evaluator", "status": "decided"}, {"id": "ESR-IMP-02", "type": "esr", "title": "Exploitation pathways and multiplier measurement were insufficient", "visibility": "public", "criterion": "Impact", "kind": "Weakness", "observation": "Stakeholder roles, application mechanisms, and tools to measure multiplier effects during and after implementation were not sufficiently specified.", "proposal_ref": "PDF pp. 33-36; PDF pp. 45-47, WP4. Exploitation was largely deferred to a late report (D4.4, M35) and framed around uptake, visibility, regional positioning, and future opportunities.", "diagnosis": "Exploitation was a dissemination task rather than a use pathway designed from project start (RC-4 and RC-6).", "baseline": "Institutional platforms, FilmEU tools, UEM networks, and policy interfaces offer channels [W-01-W-04; UP-04-UP-06; UL-07-UL-09; FE-05; FE-08; MZ-13]. They do not establish users or uptake commitments.", "response": "Create an exploitation plan at inception for each result, with user problem, value proposition, adopter, transfer package, licence, support, decision gate, cost, measurement, and post-grant owner.", "owner": "UEM coordinates; each output owner and selected external adopter validates a pathway.", "indicator": "Number of verified adaptations/adoptions, user organisations, active users, formal reuse decisions, and post-grant follow-up. Risk: outputs disseminated but unused.", "priority": "High", "priority_full": "High; partly resolved by available channels.", "root_causes": ["RC-4", "RC-6"], "origin": "evaluator", "status": "open"}, {"id": "ESR-IMP-03", "type": "esr", "title": "Communication strategy was well conceived", "visibility": "public", "criterion": "Impact", "kind": "Strength", "observation": "Websites, social media, workshops, open outputs, and policy/academic audiences were logically aligned with milestones.", "proposal_ref": "PDF pp. 33-34, Part B 3.2; PDF pp. 45-47, WP4.", "diagnosis": "The channel mix was sensible and EU visibility was clear. The weakness was operational specificity and reach beyond familiar academic audiences.", "baseline": "UEM, TLU, Lusofona, FilmEU, CEAD/CIUP, and Lusophone networks provide established channels [UP-04-UP-06; UL-07-UL-09; W-04; FE-10-FE-14].", "response": "Preserve multimodal communication and Portuguese/English access, but distinguish communication, dissemination, engagement, exploitation, and policy uptake.", "owner": "UEM communications lead; partners validate channels and audience access.", "indicator": "Audience-specific reach and engagement metrics tied to intended behaviour, not aggregate impressions alone.", "priority": "Medium", "priority_full": "Medium; resolved by evidence.", "root_causes": [], "origin": "evaluator", "status": "decided"}, {"id": "ESR-IMP-04", "type": "esr", "title": "Communication activities, tools, timing, and wider outreach were generic", "visibility": "public", "criterion": "Impact", "kind": "Weakness", "observation": "Activities, timelines, tools, channels, and outreach to wider/non-participating audiences were not fully specified or convincingly demonstrated.", "proposal_ref": "PDF pp. 33-34 and 45-47. Target groups and channels were described, but quantities, audience journeys, editorial responsibilities, feedback mechanisms, accessibility, and non-participating HEI outreach were mostly deferred to a future plan.", "diagnosis": "Strategy text preceded operational audience planning.", "baseline": "Existing institutional and FilmEU channels can support delivery [UP-04-UP-06; UL-07-UL-09; FE-08-FE-14]. Their relevance and reach in Mozambique must be verified.", "response": "Define an audience-channel-action calendar with message, language, accessible format, owner, frequency, reach target, feedback method, and desired next action. Include non-participating Mozambican HEIs and disadvantaged audiences.", "owner": "UEM, supported by partner communications units.", "indicator": "Qualified reach, repeat engagement, resource use, event conversion, and adoption inquiries. Risk: visibility without uptake.", "priority": "Medium", "priority_full": "Medium; unresolved.", "root_causes": [], "origin": "evaluator", "status": "open"}, {"id": "ESR-IMP-05", "type": "esr", "title": "Credible multi-level impact pathway", "visibility": "public", "criterion": "Impact", "kind": "Strength", "observation": "Individual skills, institutional capacity, and system/ecosystem effects were credible and relevant to Strand 2.", "proposal_ref": "PDF pp. 32-33, Part B 3.1. It distinguished short-, medium-, and long-term effects for staff/students, institutional learning, doctoral capacity, and regional transfer.", "diagnosis": "The levels were conceptually coherent, but causal assumptions, indicators, and external pathways were incomplete.", "baseline": "The current baseline allows stronger institutional and national links [UEM-01-UEM-09; MZ-01-MZ-13; P-01-P-02]. Existing implementation means some intended 2026 outputs are now baselines.", "response": "Preserve the multi-level model and explicitly map outputs to behavioural change, institutional adoption, and external use, with assumptions and contribution boundaries.", "owner": "UEM M&E/design lead; partners validate causal assumptions.", "indicator": "Outcome harvesting or contribution evidence alongside predefined indicators. Risk: claiming systemic impact from outputs alone.", "priority": "Medium", "priority_full": "Medium; partly resolved.", "root_causes": [], "origin": "evaluator", "status": "decided"}, {"id": "ESR-IMP-06", "type": "esr", "title": "Impact indicators, targets, and monitoring were unclear", "visibility": "public", "criterion": "Impact", "kind": "Weakness", "observation": "The impact framework lacked clarity on indicators, targets, and monitoring mechanisms.", "proposal_ref": "PDF pp. 25-26 and 32-36. The proposal tracked pilots, courses, frameworks, supervisors, participation, and feedback but not consistently sustained use, institutional performance, research outputs, stakeholder adoption, or benefits.", "diagnosis": "Monitoring focused on delivery and immediate outputs rather than impact (RC-4).", "baseline": "UEM statistics and national/Estonian implementation plans provide candidate metrics [UEM-07; MZ-01-MZ-04; MZ-11; TLU-03; EE-01-EE-03]. Institution-level source data and definitions remain needed.", "response": "Establish an impact measurement plan with outcome domains, baselines, targets, contribution logic, data owners, collection schedule, disaggregation, qualitative methods, and post-project follow-up.", "owner": "UEM; institutional planning/QA units and external stakeholders  input, stewardship or extension → documented external decision, practice, service or public benefit. Define what changes for each direct and downstream user and how the project plausibly contributes within 36 months.", "owner": "UEM owns the knowledge/policy/stewardship pathway with CIUEM and relevant faculties/centres; UP co-owns the education pathway and must validate programme reach, practicum/graduate networks and feasible classroom follow-through; selected external actors validate use and contribution.", "indicator": "Sector/public-service use cases, policy or management decisions influenced, external use of research/data/prototypes, cultural/natural-resource access or stewardship improvements, employer/public-body validation, and teacher-education multiplier indicators. Separate direct participants, verified use/implementation and estimated downstream reach. Risk: impact remains internal to HEIs or is inflated through unsupported prominence or multiplier claims.", "priority": "High", "priority_full": "High; partly resolved by baseline evidence.", "root_causes": ["RC-3", "RC-4"], "origin": "evaluator", "status": "open"}, {"id": "ESR-IMP-08", "type": "esr", "title": "Institutional embedding and local ownership supported sustainability", "visibility": "public", "criterion": "Impact", "kind": "Strength", "observation": "Embedding doctoral and digital-literacy outputs in existing structures and strong local ownership created a credible sustainability foundation.", "proposal_ref": "PDF pp. 35-36, Part B 3.3; WP2/WP3 milestones.", "diagnosis": "The principle was sound, but the proposal asserted limited marginal cost and existing responsibility without costed institutional decisions.", "baseline": "UEM's existing course, postgraduate regulation, draft digital strategy, and TLU agreements strengthen embedding prospects [UEM-02-UEM-05; P-01-P-02; W-01-W-02]. UP and Lusofona structures provide possible owners [UP-04-UP-06; UL-01-UL-07].", "response": "Preserve embedding as the sustainability core. For each result specify owner, authority, recurrent workload/cost, budget source, maintenance/update cycle, and performance review.", "owner": "UEM and each adopting institution provide written commitments.", "indicator": "Budgeted institutional plan and evidence of continued use after pilot support. Risk: embedding exists only in narrative.", "priority": "Medium", "priority_full": "Medium; partly resolved.", "root_causes": [], "origin": "evaluator", "status": "decided"}, {"id": "ESR-IMP-09", "type": "esr", "title": "Financial sustainability and private-sector ecosystem integration were insufficient", "visibility": "public", "criterion": "Impact", "kind": "Weakness", "observation": "Financial sustainability was not diversified or clearly specified; limited private-sector engagement weakened viability and ecosystem integration.", "proposal_ref": "PDF pp. 35-36. Continuation depended on internal resources, national mechanisms, future calls, limited marginal course costs, and ongoing cooperation, without amounts, commitments, scenarios, or finance responsibilities.", "diagnosis": "Sustainability relied on optimism, uncosted absorption, and future funding (RC-6), while external actors lacked incentives and roles (RC-3).", "baseline": "Existing course/platform/project infrastructure and P-02 provide a foundation but no automatic finance [UEM-08; P-02; W-01-W-02]. FilmEU and development-cooperation strategies suggest complementary mechanisms but do not secure funding [FE-01; FE-09; EE-05; PT-06-PT-07].", "response": "Prepare a recurrent-cost and finance model for each institutionalised result: staff time, platform/hosting, content updates, accessibility, mobility, supervision, QA, and evaluation; identify committed institutional, national, tuition/programme, mobility, research, or service sources without double counting.", "owner": "UEM finance/academic owners; every partner confirms post-grant contribution; external actors confirm any support
