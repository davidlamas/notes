const BUILD=D.build, PUB=BUILD==="public";
const N={};D.nodes.forEach(n=>N[n.id]=n);
const adj={};D.links.forEach(([a,b])=>{(adj[a]=adj[a]||new Set()).add(b);(adj[b]=adj[b]||new Set()).add(a)});
const nb=id=>[...(adj[id]||[])].map(x=>N[x]).filter(Boolean);
const isW=n=>n&&n.type==="esr"&&n.kind==="Weakness";
const wc={};D.nodes.forEach(n=>{wc[n.id]=nb(n.id).filter(isW).length});
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const PR={Critical:0,High:1,Medium:2,Low:3};
const LENSES=[["eval","Evaluation"],["struct","Structure"],["time","Time"],["partners","Partners"],["evid","Evidence"],["partb","Part B"],["cost","Cost"]]
  .filter(l=>!PUB||["eval","struct","time","partb"].includes(l[0]));
let S={lens:"eval",sel:null,rc:null};
const dot=id=>wc[id]?`<span class="dot" title="${wc[id]} reviewer weakness(es) linked">${wc[id]}</span>`:"";
const dtag=n=>n.disposition?`<span class="tag ${n.disposition}">${{keep:"Keep",revise:"Revise",new:"New"}[n.disposition]}</span>`:"";
const ptag=n=>n.priority&&n.type==="esr"&&n.kind==="Weakness"?`<span class="tag ${n.priority==="Critical"?"crit":n.priority==="High"?"high":""}">${esc(n.priority)}</span>`:"";
const byType=t=>D.nodes.filter(n=>n.type===t);

function lensEval(){
 const sc=D.scores;let h=`<div class="cols c4">`;
 for(const c of["Relevance","Design","Partnership","Impact"]){
  const its=byType("esr").filter(n=>n.criterion===c&&(!S.rc||(n.kind==="Weakness"&&(n.root_causes||[]).includes(S.rc))));
  its.sort((a,b)=>(a.kind===b.kind?0:a.kind==="Weakness"?-1:1)||PR[a.priority]-PR[b.priority]||a.id.localeCompare(b.id));
  const [s,m]=sc[c];
  h+=`<div><div class="colh"><span>${c}</span><span>${s}/${m}</span></div><div class="bar"><i style="width:${s/m*100}%"></i></div>`;
  for(const n of its){
   const resp=nb(n.id).filter(x=>["task","decision","evidence"].includes(x.type)).length;
   h+=`<button class="nd card ${n.kind==="Weakness"?"weak":"strong"}" data-id="${n.id}"><span class="id">${n.id} · ${n.kind}${n.kind==="Weakness"?" · "+esc(n.priority):""}</span><span class="ti">${esc(n.title)}</span><span class="id">${resp} linked responses/documents</span></button>`;
  }
  h+=`</div>`;
 }
 h+=`</div>`;
 const rcs=`<div class="chips"><span class="hint">Root cause:</span><button class="chipb ${S.rc?"":"on"}" data-rc="">All</button>`+Object.entries(D.rc).map(([k,v])=>`<button class="chipb ${S.rc===k?"on":""}" data-rc="${k}" title="${esc(v)}">${k} ${esc(v.split(":")[0].slice(0,34))}</button>`).join("")+`</div>`;
 return `<div class="note"><b>2026 result:</b> ${sc.total[0]}/${sc.total[1]} (threshold ${sc.threshold}); rejected only because the call budget ran out. Cards with a solid brown-orange edge and the label Weakness are the 20 weaknesses and risks the 2027 text must answer; dashed blue edges are strengths to keep. Click one to see what answers it.</div>`+rcs+h;
}
function lensStruct(){
 let h=`<div class="sech">Specific objectives (2026)</div><div class="strip">`+byType("objective").map(n=>`<button class="nd so" data-id="${n.id}">${n.id} · ${esc(n.title)}</button>`).join("")+`</div>`;
 h+=`<div class="sech">Decisions taken for 2027</div><div class="strip">`+byType("decision").map(n=>`<button class="nd" data-id="${n.id}">${n.id} · ${esc(n.title)}${dot(n.id)}</button>`).join("")+`</div>`;
 h+=`<div class="cols c5">`;
 for(const w of byType("wp")){
  const tasks=D.nodes.filter(n=>n.type==="task"&&n.wp===w.id).sort((a,b)=>(a.disposition==="new")-(b.disposition==="new")||a.id.localeCompare(b.id,undefined,{numeric:true}));
  const ds=D.nodes.filter(n=>n.type==="deliverable"&&n.wp===w.id).sort((a,b)=>a.month-b.month);
  const ms=D.nodes.filter(n=>n.type==="milestone"&&n.wp===w.id).sort((a,b)=>a.month-b.month);
  const it=n=>`<button class="nd item ${n.disposition==="new"?"new":""} ${wc[n.id]?"hw":""}" data-id="${n.id}"><b>${n.id.startsWith("NT")?"New":n.id}</b> ${esc(n.title)}${n.month?` <span class="m">M${n.month}${n.lead?" · "+n.lead:""}</span>`:""}</button>`;
  h+=`<div><button class="nd card" data-id="${w.id}" style="border-left-color:#111"><span class="id">${w.id} · lead ${w.lead2026} → ${w.lead2027} (proposed) ${dtag(w)}${dot(w.id)}</span><span class="ti">${esc(w.title)}</span></button>
   <div class="sech">Tasks</div>${tasks.map(it).join("")}<div class="sech">Deliverables</div>${ds.map(it).join("")}<div class="sech">Milestones</div>${ms.map(it).join("")}</div>`;
 }
 return h+`</div>`;
}
function lensTime(){
 const W=36,pos=m=>((m-.5)/W*100).toFixed(2)+"%";
 let h=`<div class="note">Months 1–36 of the 2026 plan. Task windows exist only in the 2026 graphic timetable, so tasks are not drawn. Dashed lines are General Assemblies (M1 Maputo, M12 Tallinn, M24 Lisbon, M35 Maputo). A brown-orange ring means the item is tied to a reviewer weakness.</div><div class="tl">`;
 h+=`<div class="tlrow"><div class="tll"></div><div class="trk"><div class="ruler">`+Array.from({length:W},(_,i)=>`<span>${i+1}</span>`).join("")+`</div></div></div>`;
 for(const w of byType("wp")){
  const items=D.nodes.filter(n=>(n.type==="deliverable"||n.type==="milestone")&&n.wp===w.id);
  const lane={};const place=t=>{const a=items.filter(n=>n.type===t).sort((x,y)=>x.month-y.month);const ends=[];a.forEach(n=>{let l=0;while(ends[l]!==undefined&&n.month-ends[l]<3.2)l++;ends[l]=n.month;lane[n.id]=l});return ends.length||1};
  const ml=place("milestone"),dl=place("deliverable");
  const H=24*ml+24*dl+16;
  h+=`<div class="tlrow" style="height:${H}px"><div class="tll"><button class="nd" data-id="${w.id}" style="border:0;background:none;font:inherit;font-weight:600;padding:0">${w.id} ${esc(w.title)}${dot(w.id)}</button><div class="sub">lead ${w.lead2026} → ${w.lead2027}</div></div><div class="trk">`;
  for(const m of[1,12,24,35])h+=`<div class="ga" style="left:${pos(m)}"></div>`;
  items.filter(n=>n.type==="milestone").forEach(n=>h+=`<button class="nd mk ms ${wc[n.id]?"hw":""}" data-id="${n.id}" style="left:${pos(n.month)};top:${4+lane[n.id]*24}px" title="${esc(n.title)} · M${n.month}">◆ ${n.id}</button>`);
  items.filter(n=>n.type==="deliverable").forEach(n=>h+=`<button class="nd mk dl ${wc[n.id]?"hw":""}" data-id="${n.id}" style="left:${pos(n.month)};top:${8+ml*24+lane[n.id]*24}px" title="${esc(n.title)} · M${n.month}">■ ${n.id}</button>`);
  h+=`</div></div>`;
 }
 return h+`</div>`;
}
function lensPartners(){
 const ws=byType("wp");
 let h=`<div class="note">Roles are the 2026 sealed roles and the proposed 2027 shifts that follow from decisions 1 and 3. Anything marked "to validate" is not agreed with the partner. Only the TLU–UEM MoU and addendum are signed instruments.</div><table><tr><th>Partner</th>${ws.map(w=>`<th><button class="nd" data-id="${w.id}" style="border:0;background:none;font:inherit;color:inherit;padding:0">${w.id}</button></th>`).join("")}<th>2027 role (proposed)</th></tr>`;
 for(const p of byType("partner")){
  h+=`<tr class="nd" data-id="${p.id}"><td><b>${p.id}</b><br><span class="sub">${esc(p.title)}</span></td>`;
  for(const w of ws){
   const dn=D.nodes.filter(n=>n.type==="deliverable"&&n.wp===w.id&&n.lead===p.id).length,mn=D.nodes.filter(n=>n.type==="milestone"&&n.wp===w.id&&n.lead===p.id).length;
   h+=`<td>${w.lead2026===p.id?'<span class="tag">Lead 2026</span>':""}${w.lead2027===p.id?'<span class="tag new">Lead 2027</span>':""}${dn||mn?`<div class="sub">${dn} deliverable${dn===1?"":"s"}, ${mn} milestone${mn===1?"":"s"} in 2026</div>`:""}</td>`;
  }
  h+=`<td>${esc(p.role2027)}${dot(p.id)}</td></tr>`;
 }
 return h+`</table>`;
}
function lensEvid(){
 const ev=byType("evidence").sort((a,b)=>PR[a.priority]-PR[b.priority]||a.id.localeCompare(b.id));
 let h=`<div class="note"><b>The application accepts only Part A, Part B and the budget.</b> No support letters or annexes. These documents are for our own assurance: each one must end up as a precise statement in Part B. "Held: partial" means some of it is already in the baseline folder.</div>
 <table><tr><th>ID</th><th>Document to secure</th><th>From</th><th>Held</th><th>Priority</th><th>Reviewer weaknesses</th><th>Lands in</th></tr>`;
 for(const e of ev){
  const w=nb(e.id).filter(isW).length,pb=nb(e.id).filter(x=>x.type==="partb").map(x=>x.id.slice(3));
  h+=`<tr class="nd" data-id="${e.id}"><td>${e.id}</td><td>${esc(e.title)}</td><td>${e.owner}</td><td>${e.held}</td><td><span class="tag ${e.priority==="Critical"?"crit":e.priority==="High"?"high":""}">${e.priority}</span></td><td>${w?dot(e.id):"–"}</td><td>${pb.join(", ")}</td></tr>`;
 }
 return h+`</table>`;
}
function lensPartB(){
 let h=`<div class="note">2026 Part B structure. For each section: the reviewer observations it has to answer and the documents that feed it. Drafting has not started.</div><table><tr><th>Section</th><th>Reviewer weaknesses to answer</th><th>Strengths to keep</th>${PUB?"":"<th>Documents</th>"}</tr>`;
 let last="";
 for(const s of byType("partb")){
  if(s.criterion!==last){h+=`<tr><td colspan="${PUB?3:4}" style="background:#faf9f6"><b>${s.criterion}</b></td></tr>`;last=s.criterion}
  const e=nb(s.id).filter(x=>x.type==="esr"),b=x=>`<button class="nd tag ${x.kind==="Weakness"?"high":"keep"}" data-id="${x.id}" title="${esc(x.title)}">${x.id.slice(4)}</button>`;
  h+=`<tr class="nd" data-id="${s.id}"><td>${esc(s.title)}${dot(s.id)}</td><td>${e.filter(isW).map(b).join(" ")||"–"}</td><td>${e.filter(x=>!isW(x)).map(b).join(" ")||"–"}</td>${PUB?"":`<td>${nb(s.id).filter(x=>x.type==="evidence").length}</td>`}</tr>`;
 }
 return h+`</table>`;
}
function lensCost(){
 const fmt=v=>"€"+v.toLocaleString("en",{minimumFractionDigits:2,maximumFractionDigits:2});
 const ps=byType("partner").filter(p=>p.budget2026),ws=byType("wp");
 const tp=ps.reduce((a,p)=>a+p.budget2026,0),tw=ws.reduce((a,w)=>a+w.cost2026,0),pm=ws.reduce((a,w)=>a+w.pm2026,0);
 return `<div class="note"><b>2026 sealed figures only.</b> No 2027 budget or person-month figures are entered until the call rules are checked and the work plan is fixed.</div>
 <div class="cols" style="grid-template-columns:1fr 1fr"><div><div class="sech">Requested by partner (2026)</div><table><tr><th>Partner</th><th>EU contribution</th></tr>${ps.map(p=>`<tr class="nd" data-id="${p.id}"><td>${p.id}</td><td>${fmt(p.budget2026)}</td></tr>`).join("")}<tr><td><b>Total</b></td><td><b>${fmt(tp)}</b></td></tr></table></div>
 <div><div class="sech">Cost by work package (2026)</div><table><tr><th>WP</th><th>PM</th><th>Cost</th></tr>${ws.map(w=>`<tr class="nd" data-id="${w.id}"><td>${w.id} ${esc(w.title)}</td><td>${w.pm2026}</td><td>${fmt(w.cost2026)}</td></tr>`).join("")}<tr><td><b>Total</b></td><td><b>${pm}</b></td><td><b>${fmt(tw)}</b></td></tr></table></div></div>
 <p class="hint">Two things to reconcile before any 2027 budget: the work-package tables add to ${pm} person-months while the Part B staffing table and the budget workbook each show 156; and the two staffing tables disagree by partner.</p>`;
}
const LV={eval:lensEval,struct:lensStruct,time:lensTime,partners:lensPartners,evid:lensEvid,partb:lensPartB,cost:lensCost};

function setHash(a,b,c){try{history.replaceState(null,"",c)}catch(e){}}
function render(){
 document.getElementById("nav").innerHTML=LENSES.map(([k,v])=>`<button class="${S.lens===k?"on":""}" data-lens="${k}">${v}</button>`).join("");
 const st=document.getElementById("stage"),y=st.scrollTop;st.innerHTML='<div class="trace" id="trace"></div>'+LV[S.lens]();st.scrollTop=y;st.querySelectorAll('tr.nd').forEach(r=>{r.tabIndex=0;r.setAttribute('role','button')});hl();panel();
 setHash("#lens="+S.lens+(S.sel?"&sel="+S.sel:""));
}
function trace(){
 const el=document.getElementById("trace");if(!el)return;const n=N[S.sel];
 if(!n){el.style.display="none";return}
 const L=nb(n.id).sort((a,b)=>(isW(b)-isW(a))||a.id.localeCompare(b.id,undefined,{numeric:true}));
 el.style.display="block";
 el.innerHTML=`<b>${n.id} ${esc(n.title)}</b> connects to ${L.length}: `+L.map(x=>`<button class="${isW(x)?"w":x.type==="esr"?"s":""}" data-go="${x.id}" title="${esc(x.title)}">${x.id}</button>`).join("")+`<button class="x" id="tclr">clear</button>`;
 document.getElementById("tclr").onclick=()=>{S.sel=null;render()};
}
function hl(){trace();
 const nbs=S.sel?new Set([S.sel,...(adj[S.sel]||[])]):null;
 document.querySelectorAll("#stage .nd[data-id]").forEach(e=>{const id=e.dataset.id;e.classList.remove("sel","lk","dim");
  if(!nbs)return;if(id===S.sel)e.classList.add("sel");else if(nbs.has(id))e.classList.add("lk");else e.classList.add("dim")});
}
const TL={esr:"Reviewer observations",task:"Tasks",deliverable:"Deliverables",milestone:"Milestones",wp:"Work packages",decision:"Decisions",evidence:"Documents to secure",partb:"Part B sections",partner:"Partners",objective:"Objectives"};
const ORIG={decided:"Decided by David (decision log)",proposed:"Proposed by the assistant, not yet confirmed by partners","sealed-2026":"From the sealed 2026 proposal",evaluator:"EACEA evaluation of the 2026 proposal",matrix:"From the ESR response matrix evidence list"};
function panel(){
 const p=document.getElementById("panel"),n=N[S.sel];
 if(!n){p.innerHTML=`<h2>Select anything</h2><p class="hint">Click any card, marker, row or section. Everything it connects to is highlighted in the view, and listed here. Switch lens and the selection stays.</p><p class="hint"><span class="dot">3</span> A brown-orange number means the item is tied to that many reviewer weaknesses from the 2026 evaluation.</p>`;return}
 const f=(l,v)=>v?`<div class="f"><b>${l}</b>${esc(v)}</div>`:"";
 let h=`<div><span class="tag">${TL[n.type]?TL[n.type].replace(/s$/,""):n.type}</span>${dtag(n)}${n.type==="esr"?`<span class="tag ${n.kind==="Weakness"?"high":"keep"}">${n.kind}</span>`:""}${ptag(n)}</div><h2>${n.id} · ${esc(n.title)}</h2>`;
 if(n.type==="esr"){
  h+=f("Evaluator observation",n.observation)+f("What the 2026 proposal said",n.proposal_ref)+f("Diagnosis",n.diagnosis)+f("Evidence now available",n.baseline);
  h+=`<div class="f"><b>Required 2027 response</b><div class="resp">${esc(n.response)}</div></div>`+(PUB?"":f("Owner and validation needed",n.owner))+f("Proof or indicator",n.indicator)+f("Root causes",(n.root_causes||[]).map(r=>r+" "+D.rc[r]).join(" · "));
 }else{
  h+=f("Detail",n.detail)+f("Why it is needed",n.use)+f("Location",n.location);
  if(n.type==="wp")h+=f("Lead",`2026: ${n.lead2026} · 2027 proposed: ${n.lead2027}`)+f("Duration",n.duration);
  if(n.type==="partner"){h+=f("2026 role",n.role2026)+f("2027 role",n.role2027)}
  if(n.type==="deliverable"||n.type==="milestone")h+=f("Due",`Month ${n.month} · lead ${n.lead}`);
  if(n.type==="evidence")h+=f("From",n.owner)+f("Held in baseline folder",n.held)+f("Priority",n.priority);
  if(n.type==="partb")h+=f("Drafting",n.draft);
  h+=f("Note",n.note);
 }
 h+=`<div class="f"><b>Origin</b>${ORIG[n.origin]||""}</div>`;
 const g={};nb(n.id).forEach(x=>{(g[x.type]=g[x.type]||[]).push(x)});
 for(const t of["esr","decision","task","deliverable","milestone","wp","partb","evidence","partner","objective"]){
  if(!g[t])continue;h+=`<div class="lk-g">${TL[t]} (${g[t].length})</div>`;
  g[t].sort((a,b)=>(isW(b)-isW(a))||a.id.localeCompare(b.id,undefined,{numeric:true})).forEach(x=>h+=`<button class="lk-b ${isW(x)?"w":x.type==="esr"?"s":""}" data-go="${x.id}"><b>${x.id}</b> ${esc(x.title)}</button>`);
 }
 h+=`<button class="copy" id="cp">Copy link to this view</button><button class="copy" id="clr">Clear</button>`;
 p.innerHTML=h;
 document.getElementById("cp").onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(location.href);document.getElementById("cp").textContent="Copied"};
 document.getElementById("clr").onclick=()=>{S.sel=null;render()};
}
document.addEventListener("click",e=>{
 const t=e.target.closest("[data-lens],[data-rc],[data-go],#stage [data-id]");if(!t)return;
 if(t.dataset.lens){S.lens=t.dataset.lens;render()}
 else if(t.dataset.rc!==undefined){S.rc=t.dataset.rc||null;render()}
 else if(t.dataset.go){S.sel=t.dataset.go;hl();panel();setHash("#lens="+S.lens+"&sel="+S.sel)}
 else if(t.dataset.id){e.stopPropagation();S.sel=S.sel===t.dataset.id?null:t.dataset.id;hl();panel();setHash("#lens="+S.lens+(S.sel?"&sel="+S.sel:""))}
});
document.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.matches&&e.target.matches("tr.nd")){e.preventDefault();e.target.click()}});
const q=document.getElementById("q"),res=document.getElementById("res");
q.addEventListener("input",()=>{const v=q.value.trim().toLowerCase();if(v.length<2){res.style.display="none";return}
 const r=D.nodes.filter(n=>(n.id+" "+n.title).toLowerCase().includes(v)).slice(0,9);
 res.innerHTML=r.map(n=>`<button data-pick="${n.id}"><b>${n.id}</b> ${esc(n.title)}</button>`).join("")||`<button>No match</button>`;res.style.display="block"});
res.addEventListener("click",e=>{const b=e.target.closest("[data-pick]");if(b){S.sel=b.dataset.pick;res.style.display="none";q.value="";render()}});
(function init(){
 const m=Object.fromEntries(location.hash.slice(1).split("&").filter(Boolean).map(x=>x.split("=")));
 if(m.lens&&LV[m.lens]&&LENSES.some(l=>l[0]===m.lens))S.lens=m.lens;if(m.sel&&N[m.sel])S.sel=m.sel;
 document.getElementById("badge").textContent=PUB?"Public working view · draft, not a commitment":"";
 document.getElementById("foot").textContent="Sources: sealed 2026 proposal (SEP-211281191), 2026 Evaluation Summary Report, 2027 pre-blueprint decision log. Items marked Revise/New are proposals until partners confirm. Generated "+D.generated+".";
 render();
})();
</script></body></html>
